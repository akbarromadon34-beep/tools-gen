
<div class="cookie-upload">
  <label for="cookieFile"><strong>Import Cookie File (.txt)</strong></label>
  <input
    type="file"
    id="cookieFile"
    accept=".txt,text/plain"
  />
  <p id="fileStatus">Belum ada file yang dipilih.</p>
</div>

<style>
.cookie-upload {
  margin: 18px 0;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fafafa;
}
.cookie-upload label {
  display: block;
  margin-bottom: 10px;
}
.cookie-upload input {
  display: block;
  width: 100%;
  font-size: 13px;
}
#fileStatus {
  margin-bottom: 0;
  font-size: 12px;
  color: #666;
}
</style>

<script>
document.getElementById("cookieFile").addEventListener("change", async function () {
  const file = this.files?.[0];
  const status = document.getElementById("fileStatus");

  if (!file) {
    status.textContent = "Belum ada file yang dipilih.";
    return;
  }

  if (!file.name.toLowerCase().endsWith(".txt") || file.size > 100000) {
    status.textContent = "Pilih file .txt maksimal 100 KB.";
    this.value = "";
    return;
  }

  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(line => line.trim() && !line.startsWith("#"));
  const validFormat = lines.length > 0 && lines.every(line => line.split("\t").length === 7);

  status.textContent = validFormat
    ? `Format Netscape terdeteksi: ${lines.length} baris. Cookie autentikasi tidak diproses.`
    : "Format tidak dikenali. Pastikan file menggunakan format Netscape.";
});
</script>
