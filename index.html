
<div class="login-card">
  <div class="message-header">Kuki Sukses Dikonversi, Bos!</div>

  <h3>Hasil Demo:</h3>
  <pre id="demoToken">DEMO-ACCESS-001</pre>

  <p>Pilih perangkat untuk membuka Netflix resmi:</p>

  <button onclick="openNetflix('phone')">Phone Login ↗</button>
  <button onclick="openNetflix('pc')">PC/Laptop Login ↗</button>
  <button onclick="openNetflix('tv')">TV Login ↗</button>

  <p id="deviceStatus" aria-live="polite"></p>
</div>

<style>
.login-card {
  max-width: 520px;
  margin: 24px auto;
  padding: 18px;
  border-radius: 14px;
  background: #fff;
  color: #222;
  font-family: Arial, sans-serif;
  box-shadow: 0 5px 20px #0002;
}
.login-card h3 { margin-bottom: 8px; }
.login-card pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #159ec1;
  font-size: 14px;
}
.login-card button {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 0;
  border-radius: 7px;
  background: #78ad76;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.login-card button:hover { background: #5d965c; }
#deviceStatus { font-size: 12px; color: #666; }
</style>

<script>
function openNetflix(device) {
  const messages = {
    phone: "Netflix resmi dibuka untuk perangkat mobile.",
    pc: "Netflix resmi dibuka untuk komputer.",
    tv: "Buka aplikasi Netflix di Smart TV kamu."
  };

  document.getElementById("deviceStatus").textContent =
    messages[device];

  if (device === "tv") {
    return;
  }

  window.open(
    "https://www.netflix.com/",
    "_blank",
    "noopener,noreferrer"
  );
}
</script>
